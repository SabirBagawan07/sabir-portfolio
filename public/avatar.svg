<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />
  <circle cx="200" cy="200" r="180" stroke="url(#avatarGrad)" stroke-width="3" fill="none" opacity="0.6" />
  <circle cx="200" cy="200" r="160" fill="url(#glowGrad)" />

  <!-- Data / Code Visual elements -->
  <g opacity="0.25">
    <path d="M 60 120 L 340 120 M 60 200 L 340 200 M 60 280 L 340 280" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6,6"/>
    <path d="M 120 60 L 120 340 M 200 60 L 200 340 M 280 60 L 280 340" stroke="#38bdf8" stroke-width="1" stroke-dasharray="6,6"/>
  </g>

  <!-- Silhouette / Developer Avatar -->
  <!-- Head -->
  <circle cx="200" cy="150" r="55" fill="#1e293b" stroke="url(#avatarGrad)" stroke-width="3"/>
  
  <!-- Modern Glasses (Data Analyst Vibe) -->
  <rect x="165" y="140" width="30" height="20" rx="4" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <rect x="205" y="140" width="30" height="20" rx="4" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <line x1="195" y1="150" x2="205" y2="150" stroke="#38bdf8" stroke-width="3"/>

  <!-- Smile -->
  <path d="M 180 180 Q 200 195 220 180" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

  <!-- Shoulders & Body -->
  <path d="M 100 330 C 100 240, 300 240, 300 330 Z" fill="#1e293b" stroke="url(#avatarGrad)" stroke-width="3"/>

  <!-- Code/Data Overlay Badge -->
  <g transform="translate(140, 270)">
    <rect x="0" y="0" width="120" height="36" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="2"/>
    <text x="60" y="23" fill="#34d399" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">&lt;Python/&gt;</text>
  </g>
</svg>
